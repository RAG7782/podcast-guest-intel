# Benchmarks by Tier - Podcast Production Squad
# Métricas detalhadas por nível de operação (PONTO FRACO #3 resolvido)

# CONTEXTO GLOBAL
global_context:
  total_podcasts: 4580000
  total_listeners_worldwide: 584000000
  median_downloads_per_episode: 150
  top_10_pct_threshold: 4700
  top_1_pct_threshold: 35000

  reality:
    statement: "Maioria dos podcasts tem audiência pequena. Aceitar isso permite expectativas realistas."
    data_source: "Buzzsprout 2024 Global Stats"

# TIER SOLO
tier_solo:
  definition:
    who: "1 pessoa fazendo tudo"
    tools: "AI-assist (Descript, Whisper, Opus Clip)"
    investment: "Baixo (R$2-5K inicial)"
    time_commitment: "10-20h/semana"
    goal: "Side income ou hobbyist"

  target_metrics:
    downloads_per_episode:
      month_1_3: "50-100"
      month_4_6: "100-300"
      month_7_12: "300-500"
      year_2: "500-1000"
      percentile: "Top 30-40% global (se 500+)"

    growth_rate:
      healthy: "5-10% MoM"
      excellent: "15-25% MoM"
      stagnant: "< 3% MoM"
      action_if_stagnant: "Reavaliar conteúdo, formato, marketing"

    retention:
      completion_rate:
        poor: "< 40%"
        average: "50-60%"
        good: "60-70%"
        excellent: "> 70%"
      average_listen_time: "60-70% do episódio"
      drop_off_points: "Monitor via Spotify analytics"

    engagement:
      reviews_per_month:
        realistic: "1-2"
        good: "3-5"
        excellent: "> 5"
      comments_social:
        realistic: "5-15/episódio"
        good: "20-50/episódio"
      email_list:
        month_6: "50-100 subscribers"
        year_1: "100-300 subscribers"
        year_2: "300-800 subscribers"
        open_rate: "25-35%"

    community:
      size:
        month_6: "10-30 members"
        year_1: "30-80 members"
        year_2: "80-200 members"
      active_rate: "20-30% post regularmente"
      platform: "Discord ou Telegram"

  revenue_benchmarks:
    timeline: "Não antes de 6-12 meses"
    month_7_12:
      membership: "5-15 members x R$25 = R$125-375/mês"
      consulting: "0-1 client/trimestre"
      total: "R$125-500/mês"
    year_2:
      membership: "20-50 members x R$25 = R$500-1250/mês"
      sponsors: "0-1 sponsor small (R$0-800/mês)"
      consulting: "R$500-2K/mês avg"
      total: "R$1-4K/mês"

  realistic_timeline:
    month_0_3:
      focus: "Launch, testar formato, iterar"
      downloads: "20-100/ep"
      revenue: "R$0"
      action: "Publicar consistentemente, não focar em metrics"

    month_4_6:
      focus: "Primeiros 100 listeners regulares"
      downloads: "100-300/ep"
      revenue: "R$0"
      action: "Start building email list, criar clips"

    month_7_12:
      focus: "Consistência + considerar monetização"
      downloads: "300-500/ep"
      revenue: "R$125-500/mês"
      action: "Launch membership se 300+ downloads consistente"

    year_2:
      focus: "Optimização + scale modesto"
      downloads: "500-1K/ep"
      revenue: "R$1-4K/mês"
      action: "Considerar upgrade para Studio tier se growth sustentável"

  common_mistakes:
    - mistake: "Episódios inconsistentes"
      impact: "Audience não se forma, algorithm penaliza"
      fix: "Commit to schedule (semanal mínimo)"

    - mistake: "Zero marketing"
      impact: "Discovery orgânico é lento"
      fix: "Clips social media, SEO, guest swaps"

    - mistake: "Não criar clips"
      impact: "Perde discovery via social"
      fix: "3-5 clips/episódio via Opus Clip"

    - mistake: "Não ter newsletter"
      impact: "Não own audience (depende de plataformas)"
      fix: "Start email list dia 1"

    - mistake: "Monetizar muito cedo"
      impact: "Quebra trust, conversão baixa"
      fix: "Wait for 500-1K listeners antes de monetizar"

  success_factors:
    consistency:
      importance: "Critical"
      metric: "Publicar toda semana > perfeição"
    niche:
      importance: "Very High"
      metric: "Better 1000 true fans que 10K casual"
    seo:
      importance: "High"
      metric: "Títulos + show notes otimizados"
    social:
      importance: "High"
      metric: "Clips + engagement > broadcasting"
    newsletter:
      importance: "Critical"
      metric: "Own your audience, plataformas podem mudar"

# TIER STUDIO
tier_studio:
  definition:
    who: "2-4 pessoas"
    team: "Host + Producer/Editor + Designer (freelancer ou part-time)"
    investment: "Médio (R$10-20K inicial)"
    time_commitment: "30-50h/semana (team combined)"
    goal: "Profissional, pode ser full-time"

  target_metrics:
    downloads_per_episode:
      month_1_3: "500-1500"
      month_4_6: "1500-3000"
      month_7_12: "3000-5000"
      year_2: "5000-15000"
      percentile: "Top 10-15% global (se 5K+)"

    growth_rate:
      healthy: "8-15% MoM"
      excellent: "20-30% MoM"
      stagnant: "< 5% MoM"
      action_if_stagnant: "Investir em paid ads, guest strategy agressiva"

    retention:
      completion_rate:
        poor: "< 50%"
        average: "60-70%"
        good: "70-80%"
        excellent: "> 80%"
      average_listen_time: "70-80% do episódio"
      replay_rate: "5-10% de ouvintes re-escutam momentos"

    engagement:
      reviews_per_month:
        realistic: "5-15"
        good: "20-40"
        excellent: "> 50"
      comments_social:
        realistic: "30-100/episódio"
        good: "100-300/episódio"
      email_list:
        month_6: "500-1500 subscribers"
        year_1: "1500-3000 subscribers"
        year_2: "3000-8000 subscribers"
        open_rate: "20-30%"

    community:
      size:
        month_6: "100-300 members"
        year_1: "300-800 members"
        year_2: "800-2000 members"
      active_rate: "15-25% post regularmente"
      moderation: "Dedicated community manager (part-time)"

  revenue_benchmarks:
    timeline: "3-6 meses para first significant revenue"
    month_4_6:
      membership: "50-100 members x R$30 = R$1.5-3K/mês"
      sponsors: "1-2 sponsors x R$3-6K = R$3-12K/mês"
      consulting: "R$1-3K/mês"
      total: "R$5.5-18K/mês"
    month_7_12:
      membership: "100-200 members x R$35 = R$3.5-7K/mês"
      sponsors: "2-3 sponsors x R$8-15K = R$16-45K/mês"
      programmatic: "R$1-3K/mês (back-catalog)"
      consulting: "R$3-8K/mês"
      events: "2/ano x R$8K = R$1.3K/mês avg"
      total: "R$24-64K/mês"
    year_2:
      membership: "200-500 members x R$35 = R$7-17.5K/mês"
      sponsors: "3-5 sponsors x R$15-30K = R$45-150K/mês"
      programmatic: "R$5-15K/mês"
      consulting: "R$8-20K/mês"
      events: "4/ano x R$10K = R$3.3K/mês avg"
      courses: "R$5-15K/mês evergreen"
      total: "R$73-221K/mês"

  realistic_timeline:
    month_0_3:
      focus: "Launch strong, produção profissional desde dia 1"
      downloads: "500-1500/ep"
      revenue: "R$1-5K/mês"
      action: "Strategic guests, multi-platform distribution"

    month_4_6:
      focus: "First sponsors, scale audience"
      downloads: "1500-3K/ep"
      revenue: "R$5-18K/mês"
      action: "Pitch sponsors, launch membership"

    month_7_12:
      focus: "Consistent revenue, profitability"
      downloads: "3-5K/ep"
      revenue: "R$24-64K/mês"
      action: "Optimize operations, consider hiring full-time"

    year_2:
      focus: "Scale, diversify revenue"
      downloads: "5-15K/ep"
      revenue: "R$73-221K/mês"
      action: "Expand offerings (courses, events, white-label)"

  common_mistakes:
    - mistake: "Over-investing antes de audience"
      impact: "Expensive studio sem downloads = burn cash"
      fix: "Bootstrap equipment, upgrade conforme cresce"

    - mistake: "Ignorar community"
      impact: "Audience não engajada, churn alto"
      fix: "Discord/Telegram active, responder comentários"

    - mistake: "Não fazer cross-promo"
      impact: "Growth mais lento"
      fix: "Guest swaps com podcasts similares"

    - mistake: "Aceitar sponsors não alinhados"
      impact: "Trust quebrado, audience resent"
      fix: "Only sponsors you'd genuinely recommend"

  success_factors:
    guests:
      importance: "Critical"
      strategy: "High-value guests com audiência própria"
      booking: "2-4 semanas antecedência, pipeline constante"
    production:
      importance: "High"
      metric: "Broadcast-level audio, professional editing"
    seo:
      importance: "Very High"
      metric: "Rank no Google para keywords principais"
    community:
      importance: "Critical"
      metric: "Engaged community > large passive audience"
    diversification:
      importance: "High"
      metric: "Multiple revenue streams (não só ads)"

