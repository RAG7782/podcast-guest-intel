# BRASIL-SPECIFIC ADJUSTMENTS
brazil_adjustments:
  spotify_partner:
    threshold:
      episodes: 3
      hours: 2000
      listeners: 1000
      period: "últimos 60 dias"
    achievable:
      solo: "12-18 meses"
      studio: "4-8 meses"
      broadcast: "1-3 meses"

  video_importance:
    critical: "70% dos top podcasts BR são video-first"
    youtube_growth: "Crescendo mais rápido que Spotify"
    strategy: "Video podcast > audio-only para growth"

  long_form:
    duration: "2-4h aceito (Flow, Podpah)"
    caveat: "Só funciona se conversational + entertaining"
    not_recommended_for: "Solo tier (hard to sustain energy)"

# FINAL NOTES
notes:
  expectations:
    - "Maioria dos podcasts tem audiência pequena. Top 10% é achievement real."
    - "Growth leva tempo. 12-24 meses para traction significativa."
    - "Better 100 ouvintes engaged que 10K passive."

  patience:
    - "Year 1 é investment (tempo/dinheiro). Year 2+ colhe resultados."
    - "Consistency > perfeição. Publicar toda semana por 12 meses > episódios perfeitos esporádicos."

  reality_check:
    - "Não compare com Flow/Podpah (outliers). Compare com peers no seu tier."
    - "Celebrate milestones: 100 downloads, 500 downloads, 1K downloads são wins."
