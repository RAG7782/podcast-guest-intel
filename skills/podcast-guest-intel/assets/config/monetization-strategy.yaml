# MONETIZATION CHECKLIST
checklist:
  before_monetizing:
    - "[ ] 1000+ regular listeners"
    - "[ ] Consistent publishing (3+ meses)"
    - "[ ] Engagement metrics good (completion, comments)"
    - "[ ] Clear audience profile (who are they?)"
    - "[ ] Trust established (não monetizar dia 1)"

  first_revenue:
    - "[ ] Media kit prepared (stats, demographics, sponsor deck)"
    - "[ ] Membership platform escolhido"
    - "[ ] Perks definidos e deliverable"
    - "[ ] Payment processor setup"

  scaling:
    - "[ ] Multiple revenue streams (não 1 fonte)"
    - "[ ] Analytics tracking revenue per source"
    - "[ ] Diversify sponsors (não 100% dependency)"

# COMMON MISTAKES
mistakes:
  monetize_too_early:
    problem: "Launch membership com 100 listeners"
    result: "Zero conversão, looks desperate"
    fix: "Wait for 1000+ engaged listeners"

  wrong_sponsors:
    problem: "Accept sponsor não alinhado ($$$ only)"
    result: "Loss of trust, audiência sente sell-out"
    fix: "Only sponsors you'd genuinely recommend"

  overdo_ads:
    problem: "3-5 ads por episódio (15+ min)"
    result: "Audiência abandona, completion drops"
    fix: "Max 2 ads/episódio (5 min total)"

  undervalue:
    problem: "Charging R$5/mês membership (too cheap)"
    result: "Revenue baixa, perception de low value"
    fix: "R$20-35 é sweet spot"

  inconsistent:
    problem: "Launch membership, não deliver perks"
    result: "Churn alto, reputation damage"
    fix: "Deliver perks consistentemente"
