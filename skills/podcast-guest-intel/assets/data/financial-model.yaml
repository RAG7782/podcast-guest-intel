# Financial Model - Podcast Production Squad
# Modelo de custos e receitas por tier.
#
# STATUS DOS NUMEROS: todos os valores em R$ abaixo sao ESTIMATIVAS SEM FONTE
# (premissas de exemplo, cambio aprox. R$5/US$). Precos de SaaS e de mercado mudam:
# cotar antes de usar em proposta, orcamento ou decisao. As projecoes de receita
# da versao anterior (lucro de R$1M+/ano etc.) foram removidas: nao tinham fonte e
# tinham erro de conta (ex.: 1 sponsor x CPM 70 x 2.000 downloads = R$140, nao R$1.400).
# Use as FORMULAS com os seus dados reais (performance-report / analytics).

formulas:
  ads_revenue: "sponsors x (downloads_por_episodio / 1000) x CPM x episodios_no_mes"
  membership_revenue: "membros x preco_mensal"
  amortized_one_time: "custo_unico_total / meses_de_amortizacao"
  monthly_burn: "custos_mensais + amortized_one_time"
  breakeven: "primeiro mes em que receita_mensal >= monthly_burn"
  roi: "(receita_acumulada - custo_acumulado) / investimento_inicial"
  notes:
    - "CPM e taxa de preenchimento de anuncio dependem de nicho e audiencia: medir, nao supor"
    - "Downloads por episodio vem do host/analytics (padrao IAB v2.x quando o host for certificado)"

# TIER SOLO
tier_solo:
  description: "1 pessoa fazendo tudo, AI-assist tools, side project ou hobbyist"
  monthly_costs:  # estimativa, sem fonte
    hosting: {item: "Plano basico de hosting de podcast", cost: 60}
    editing: {item: "Editor baseado em texto (plano creator)", cost: 120}
    recording: {item: "Plataforma de gravacao remota (plano basico)", cost: 75}
    design: {item: "Ferramenta de design (plano pro)", cost: 55}
    social: {item: "Agendador de posts", cost: 75}
    domain_site: {item: "Dominio + site simples", cost: 30}
    total_monthly: 415
  one_time_costs:  # estimativa, sem fonte
    microphone: {item: "Microfone dinamico USB/XLR", cost: 500}
    interface: {item: "Interface de audio 1 canal (opcional se USB)", cost: 600}
    headphones: {item: "Fone fechado de monitoracao", cost: 750}
    total_one_time: 1850
    amortized_monthly: 154
    note: "Amortizado em 12 meses"
  total_monthly_including_amortization: 569
  revenue_levers:
    - "Membership (primeira receita tipica neste tier)"
    - "1 sponsor pequeno quando houver audiencia mensuravel"
    - "Consultoria/servicos gerados pelo podcast"
  breakeven:
    calculation: "Receita mensal >= R$569 (burn estimado)"
    timeline: "A calcular com dados reais; nao ha benchmark com fonte"
  notes:
    - "Solo tier e investimento de tempo > dinheiro"
    - "Custos baixos tornam o projeto sustentavel mesmo com breakeven lento"

