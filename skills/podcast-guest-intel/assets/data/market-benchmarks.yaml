# Market Benchmarks - Podcast Production Squad
# Benchmarks realistas do mercado de podcasting 2026 (PONTO FRACO #3 resolvido)

# CONTEXTO GLOBAL
global_context:
  total_podcasts: 4580000
  total_episodes: 142000000
  total_listeners: 584000000
  year_over_year_growth: "15-20%"

  distribution:
    median_downloads: 150
    top_10_pct_threshold: 4700
    top_1_pct_threshold: 35000

  reality_check: "A maioria dos podcasts tem audiência pequena. Top 10% é achievement real."

# TIER SOLO (Hobbyist ou Side Project)
tier_solo:
  definition: "1 pessoa fazendo tudo, ferramentas AI-assist, investimento baixo"

  target_downloads:
    month_1_3: "50-100/episode"
    month_4_6: "100-300/episode"
    month_7_12: "300-500/episode"
    year_2: "500-1000/episode"
    note: "Crescimento orgânico, sem marketing pago"

  target_growth:
    healthy: "5-10% MoM (month-over-month)"
    excellent: "15-25% MoM"
    stagnant: "< 3% MoM"
    action: "Se estagnado > 3 meses, reavaliar conteúdo/marketing"

  retention_metrics:
    completion_rate:
      poor: "< 40%"
      average: "50-60%"
      good: "60-70%"
      excellent: "> 70%"
    average_listen_duration: "60-70% do episódio (typical)"

  engagement:
    reviews_per_month:
      realistic: "1-2"
      good: "3-5"
      excellent: "> 5"

    comments_social:
      realistic: "5-15/episódio"
      good: "20-50/episódio"

    email_list:
      month_6: "50-100 subscribers"
      year_1: "100-300 subscribers"
      year_2: "300-800 subscribers"
      open_rate: "25-35% (healthy)"

  community:
    discord_telegram:
      month_6: "10-30 members"
      year_1: "30-80 members"
      year_2: "80-200 members"
    active_rate: "20-30% post regularmente"

  monetization:
    timeline: "Não antes de 6-12 meses"
    first_revenue:
      source: "Membership (Patreon, Apoia.se)"
      members: "5-15 paying members"
      mrr: "R$125-450/mês"
    year_2:
      revenue_range: "R$500-3K/mês"
      sources: ["Membership (primary)", "Small sponsors", "Consulting leads"]

  realistic_timeline:
    month_0_3: "Launch, testar formato, zero audiência"
    month_4_6: "Primeiros 100 listeners regulares"
    month_7_12: "Consistente 300-500 downloads, considerar monetização"
    year_2: "500-1K downloads, small revenue stream"

  common_mistakes:
    - "Episódios inconsistentes (pular semanas)"
    - "Zero marketing (esperar discovery orgânico apenas)"
    - "Não criar clips para social media"
    - "Não ter newsletter/email list"
    - "Não pedir reviews"

  success_factors:
    - "Consistency > perfeição (publicar toda semana)"
    - "Niche clear (não tentar agradar todos)"
    - "Social media presence (clips + engagement)"
    - "SEO (títulos + show notes otimizados)"
    - "Newsletter (own your audience)"

# TIER STUDIO (Profissional, pode ser full-time)
tier_studio:
  definition: "2-4 pessoas, produção profissional, investimento médio, monetização ativa"

  target_downloads:
    month_1_3: "500-1500/episode"
    month_4_6: "1500-3000/episode"
    month_7_12: "3000-5000/episode"
    year_2: "5000-15000/episode"
    note: "Inclui marketing ativo + guests com audiência"

  target_growth:
    healthy: "8-15% MoM"
    excellent: "20-30% MoM"
    stagnant: "< 5% MoM"
    action: "Se estagnado, investir em paid ads ou guest strategy"

  retention_metrics:
    completion_rate:
      poor: "< 50%"
      average: "60-70%"
      good: "70-80%"
      excellent: "> 80%"
    average_listen_duration: "70-80% do episódio"

  engagement:
    reviews_per_month:
      realistic: "5-15"
      good: "20-40"
      excellent: "> 50"

    comments_social:
      realistic: "30-100/episódio"
      good: "100-300/episódio"

    email_list:
      month_6: "500-1500 subscribers"
      year_1: "1500-3000 subscribers"
      year_2: "3000-8000 subscribers"
      open_rate: "20-30%"

  community:
    discord_telegram:
      month_6: "100-300 members"
      year_1: "300-800 members"
      year_2: "800-2000 members"
    active_rate: "15-25% post regularmente"

  monetization:
    timeline: "3-6 meses para first revenue"
    month_4_6:
      membership: "30-80 members x R$30 = R$900-2.4K/mês"
      sponsors: "1 sponsor x R$2-5K/mês"
      total: "R$3-8K/mês"
    year_1:
      membership: "100-200 members x R$30 = R$3-6K/mês"
      sponsors: "2-3 sponsors x R$5-10K/mês = R$10-30K/mês"
      total: "R$13-36K/mês"
    year_2:
      membership: "200-500 members x R$35 = R$7-17.5K/mês"
      sponsors: "3-5 sponsors x R$10-20K/mês = R$30-100K/mês"
      live_events: "R$3-8K/mês avg"
      total: "R$40-125K/mês"

  realistic_timeline:
    month_0_3: "Launch strong (produçãoprofissional desde dia 1)"
    month_4_6: "1500-3K downloads, first sponsors"
    month_7_12: "3-5K downloads, consistent revenue"
    year_2: "5-15K downloads, full-time viable"

  common_mistakes:
    - "Over-investing antes de audience (expensive studio sem downloads)"
    - "Ignorar community building"
    - "Não fazer cross-promotion com outros podcasts"
    - "Aceitar sponsors não alinhados (revenue > trust)"

  success_factors:
    - "High-value guests (strategic booking)"
    - "Multi-channel distribution (YouTube + Spotify + clips)"
    - "Strong SEO (rank no Google para keywords)"
    - "Community engagement (não só broadcast)"
    - "Consistent quality (production value alta)"

# TIER BROADCAST (Operação comercial, múltiplos shows)
tier_broadcast:
  definition: "5-10+ pessoas, broadcast quality, shows múltiplos, investimento alto"

  target_downloads:
    month_1_3: "5000-15000/episode"
    month_4_6: "15000-30000/episode"
    month_7_12: "30000-50000/episode"
    year_2: "50000-150000+/episode"
    note: "Inclui marketing agressivo + PR + celebridades"

  target_growth:
    healthy: "10-20% MoM"
    excellent: "25-40% MoM"
    stagnant: "< 8% MoM"
    action: "Adjust strategy, consider acquisitions de outros podcasts"

  retention_metrics:
    completion_rate:
      poor: "< 60%"
      average: "70%"
      good: "75-80%"
      excellent: "> 85%"
    average_listen_duration: "75-85% do episódio"

  engagement:
    reviews_per_month:
      realistic: "50-150"
      good: "200-500"
      excellent: "> 500"

    comments_social:
      realistic: "500-2000/episódio"
      good: "> 2000/episódio"

    email_list:
      month_6: "5000-15000 subscribers"
      year_1: "15000-40000 subscribers"
      year_2: "40000-100000+ subscribers"
      open_rate: "15-25%"

  community:
    discord_telegram:
      month_6: "500-1500 members"
      year_1: "1500-5000 members"
      year_2: "5000-15000 members"
    active_rate: "10-20% post regularmente"

  monetization:
    timeline: "1-3 meses para significant revenue"
    month_1_3:
      sponsors: "R$10-30K/mês"
      membership: "R$5-15K/mês"
      programmatic: "R$2-8K/mês"
      total: "R$17-53K/mês"
    year_1:
      sponsors: "R$50-150K/mês"
      membership: "R$15-50K/mês"
      programmatic: "R$10-30K/mês"
      live_events: "R$10-30K/mês avg"
      total: "R$85-260K/mês"
    year_2:
      sponsors: "R$150-500K/mês"
      membership: "R$50-150K/mês"
      programmatic: "R$30-100K/mês"
      white_label: "R$30-100K/mês"
      live_events: "R$30-100K/mês avg"
      total: "R$290-950K/mês"

  realistic_timeline:
    month_0_3: "Launch com investment alto, expectativa de profitability rápida"
    month_4_12: "Scale rápido, 20-50K downloads, profitable"
    year_2: "Multiple shows, 50K-150K+ downloads each, full team"

  key_differentiators:
    - "Spatial audio (Dolby Atmos)"
    - "Original music scores"
    - "Live events (monetization + branding)"
    - "White-label services (B2B revenue)"
    - "PR campaigns (mídia tradicional coverage)"

# BRASIL-SPECIFIC BENCHMARKS
brazil_context:
  spotify_partner_program:
    requirements:
      episodes: "3 episódios (últimos 60 dias)"
      hours: "2000 horas consumidas (últimos 60 dias)"
      listeners: "1000 unique listeners (últimos 60 dias)"
    note: "Atingível para Studio tier após 6-12 meses"

  typical_cpm:
    host_read: "R$50-100"
    programmatic: "R$25-75"
    premium_niches: "R$100-200+ (finanças, tech, B2B)"
    note: "2-3x menor que US, mas custo de vida também menor"

  video_importance:
    critical: "70% dos top podcasts BR são video-first"
    youtube_growth: "Crescendo mais rápido que Spotify"
    strategy: "Video = discovery, Audio = retention"

  long_form_tolerance:
    duration: "2-4 horas comum (Flow, Podpah)"
    global_comparison: "Únicos que toleram episódios tão longos"
    caveat: "Só funciona se conversational + entertaining"

