    seo:
      traffic_potential: "10-30% de downloads novos"
      timeline: "3-6 meses para rank"
      effort: "Medium (keywords + show notes)"

    social_clips:
      conversion: "1-3% de views → downloads"
      volume: "3-5 clips/episódio"
      effort: "Medium (AI tools ajudam)"

    word_of_mouth:
      contribution: "30-50% do crescimento orgânico"
      driver: "Content quality + shareability"

  paid:
    facebook_instagram_ads:
      cpl: "R$2-8 (cost per listener)"
      roi: "Breakeven se LTV > R$10"
      best_for: "Membership-based podcasts"

    spotify_ad_studio:
      cpm: "R$25-100 (target podcast listeners)"
      effectiveness: "High (targeted)"

    influencer_partnerships:
      cost: "R$500-5K per post"
