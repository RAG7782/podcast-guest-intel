# FINAL NOTES
notes:
  reality: "Maioria dos podcasts tem audiência pequena. Aceitar isso permite expectativas realistas."
  patience: "Crescimento leva tempo. 12-24 meses para traction significativa."
  quality: "Better 100 ouvintes engaged que 10K passive."
  sustainability: "Focar em long-term, não viral spikes."
