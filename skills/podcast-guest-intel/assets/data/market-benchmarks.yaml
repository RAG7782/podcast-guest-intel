    cross_promotion:
      effort: "Low"
      effectiveness: "Medium to High"
      best_practice: "Podcasts similares, não competitors"

# REALISTIC EXPECTATIONS
realistic_expectations:
  year_1:
    solo: "300-800 downloads/episode, R$0-2K/mês revenue"
    studio: "2K-8K downloads/episode, R$5-30K/mês revenue"
    broadcast: "10K-50K downloads/episode, R$30-200K/mês revenue"

  year_2:
    solo: "800-2K downloads/episode, R$2-8K/mês revenue"
    studio: "8K-25K downloads/episode, R$30-100K/mês revenue"
    broadcast: "50K-200K downloads/episode, R$200K-1M/mês revenue"

  breakeven:
    solo: "10-18 meses"
    studio: "6-12 meses"
    broadcast: "3-6 meses"

  unicorns:
    definition: "Top 1% (35K+ downloads/episode)"
    probability: "< 1% de podcasts"
    factors: "Celebrity host, massive investment, ou viral hit"
    note: "Não planejar para isso, mas aim high"

# DATA SOURCES
data_sources:
  - "Podcast Insights (2024-2026 data)"
  - "Buzzsprout Global Stats"
  - "Pacific Content Research"
  - "ABPod (Associação Brasileira de Podcasters)"
  - "Spotify for Creators benchmarks"
